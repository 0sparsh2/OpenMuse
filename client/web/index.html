<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OpenMuse reference client — chat, approvals, memory, schedules, connectors, and more.">
  <title>OpenMuse</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%231d4ed8'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='6' fill='none' stroke='%231d4ed8' stroke-width='2' transform='rotate(-24 16 16)'/%3E%3Ccircle cx='27' cy='10' r='2.4' fill='%231d4ed8'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app">
    <aside class="sidebar" aria-label="Primary">
      <div class="brand">
        <!-- Original OpenMuse mark: orbit ring around a core. Not affiliated with any other product. -->
        <svg viewBox="0 0 32 32" role="img" aria-label="OpenMuse logo">
          <circle cx="16" cy="16" r="6" fill="#1d4ed8"/>
          <ellipse cx="16" cy="16" rx="13" ry="6" fill="none" stroke="#1d4ed8" stroke-width="2" transform="rotate(-24 16 16)"/>
          <circle cx="27" cy="10" r="2.4" fill="#1d4ed8"/>
        </svg>
        <span class="brand-name">OpenMuse</span>
      </div>
      <nav id="nav" class="nav" aria-label="Workspace sections"></nav>
      <div class="conn-status" role="status" aria-label="Connection status">
        <span class="dot" id="connDot" aria-hidden="true"></span>
        <span id="connLabel">Connecting…</span>
      </div>
      <form id="keyForm" aria-label="API key">
        <label class="field">
          <span class="sr-only">API key</span>
          <input type="password" id="apiKey" placeholder="API key" autocomplete="off"
                 aria-label="API key (stored only in this tab's session storage)">
        </label>
        <button class="btn secondary small" type="submit" style="width:100%">Set key</button>
        <p class="muted" style="font-size:0.7rem">Kept in session storage only — never in local storage or logs.</p>
      </form>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <script src="js/openmuse-api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.getElementById("keyForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = document.getElementById("apiKey").value.trim();
      if (v) { window.OpenMuseAPI.store.apiKey = v; this.reset(); }
    });
    var existing = window.OpenMuseAPI.store.apiKey;
    if (existing) document.getElementById("apiKey").placeholder = "API key set ✓";
  </script>
</body>
</html>
