<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OpenMuse">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="description" content="OpenMuse reference client — chat, approvals, memory, schedules, connectors, and more.">
  <title>OpenMuse</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%231d4ed8'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='6' fill='none' stroke='%231d4ed8' stroke-width='2' transform='rotate(-24 16 16)'/%3E%3Ccircle cx='27' cy='10' r='2.4' fill='%231d4ed8'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app">
    <button class="top-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-controls="drawer" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="top-btn bell-btn" id="bellBtn" type="button" aria-label="Notifications" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 16V11a6 6 0 1112 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 004 0"/></svg>
      <span class="bell-dot" id="bellDot" hidden></span>
    </button>
    <div class="drawer-overlay" id="drawerOverlay" hidden></div>
    <aside class="sidebar drawer" id="drawer" aria-label="Menu">
      <div class="brand">
        <!-- Original OpenMuse mark: orbit ring around a core. Not affiliated with any other product. -->
        <svg viewBox="0 0 32 32" role="img" aria-label="OpenMuse logo">
          <circle cx="16" cy="16" r="6" fill="#1d4ed8"/>
          <ellipse cx="16" cy="16" rx="13" ry="6" fill="none" stroke="#1d4ed8" stroke-width="2" transform="rotate(-24 16 16)"/>
          <circle cx="27" cy="10" r="2.4" fill="#1d4ed8"/>
        </svg>
        <span class="brand-name">OpenMuse</span>
      </div>
      <button class="drawer-new" id="drawerNew" type="button">+ New chat</button>
      <input class="drawer-search" id="chatSearch" type="search" placeholder="Search chats" aria-label="Search chats">
      <div class="drawer-chats" id="chatList" aria-label="Chats"></div>
      <nav id="nav" class="nav" aria-label="Sections"></nav>
      <label class="drawer-theme"><input type="checkbox" id="themeToggle"> Dark mode</label>
      <div class="conn-status" role="status" aria-label="Connection status">
        <span class="dot" id="connDot" aria-hidden="true"></span>
        <span id="connLabel">Connecting…</span>
      </div>
<div class="user-box" id="userBox" hidden>
        <div class="user-avatar" id="userInitial" aria-hidden="true"></div>
        <div class="user-meta"><div class="user-name" id="userName"></div><div class="user-email" id="userEmail"></div></div>
        <button class="btn secondary small" type="button" id="signOut">Sign out</button>
      </div>
      <details class="dev-key">
        <summary>Developer API key</summary>
        <form id="keyForm" aria-label="API key">
          <label class="field">
            <span class="sr-only">API key</span>
            <input type="password" id="apiKey" placeholder="API key" autocomplete="off"
                   aria-label="API key (stored only in this tab's session storage)">
          </label>
          <button class="btn secondary small" type="submit" style="width:100%">Use key</button>
          <p class="muted" style="font-size:0.7rem">For scripts and local development. Kept in session storage only.</p>
        </form>
      </details>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
  </div>
  <div id="auth" class="auth" hidden></div>
  <script src="js/openmuse-api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.getElementById("keyForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = document.getElementById("apiKey").value.trim();
      if (v) { window.OpenMuseAPI.store.apiKey = v; location.reload(); }
    });
  </script>
</body>
</html>
