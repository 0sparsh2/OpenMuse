# Tool -> risk mapping — policies/tool-capabilities.yaml
# A deployment maps each tool capability and argument pattern to a baseline class.
# Phase 1 ships R0-R2 tools only. Later phases add R3-R5 tools here.
tools:
  monitor.create:
    risk: R2
    capabilities: [monitor.manage]
    side_effect: local_write
    # Reads a public page on a schedule and notifies the user; never acts on the page.
  monitor.list:
    risk: R0
    capabilities: [monitor.read]
    side_effect: none
  monitor.remove:
    risk: R2
    capabilities: [monitor.manage]
    side_effect: local_write
  docs.list:
    risk: R0
    capabilities: [docs.read]
    side_effect: none
  docs.read:
    risk: R1
    capabilities: [docs.read]
    side_effect: none
  docs.pdf_fields:
    risk: R1
    capabilities: [docs.read]
    side_effect: none
  docs.pdf_fill:
    risk: R2
    capabilities: [docs.write]
    side_effect: local_write
    # Writes a NEW filled copy to the user's Library; the original is never modified.
  docs.create:
    risk: R2
    capabilities: [docs.write]
    side_effect: local_write
  goals.create:
    risk: R2
    capabilities: [goals.write]
    side_effect: local_write
  goals.update:
    risk: R2
    capabilities: [goals.write]
    side_effect: local_write
  goals.list:
    risk: R0
    capabilities: [goals.read]
    side_effect: none
  goals.propose_idea:
    risk: R2
    capabilities: [ideas.write]
    side_effect: local_write
  goals.post_update:
    risk: R2
    capabilities: [feed.write]
    side_effect: local_write
  task.plan:
    risk: R0
    capabilities: [task.plan]
    side_effect: none
    # Emits a visible checklist for the user; no side effects.
  task.update:
    risk: R0
    capabilities: [task.plan]
    side_effect: none
  task.ask_user:
    risk: R0
    capabilities: [task.ask]
    side_effect: none
    # Shows a question card; the answer arrives as the user's next message.
  system.clock:
    risk: R0
    capabilities: [time.read]
    side_effect: none
  math.calc:
    risk: R0
    capabilities: [math.eval]
    side_effect: none
  files.read:
    risk: R0
    capabilities: [filesystem.read.scoped]
    side_effect: none
  files.list:
    risk: R0
    capabilities: [filesystem.read.scoped]
    side_effect: none
  web.fetch:
    risk: R0
    capabilities: [network.fetch.public]
    side_effect: none
  tools.load_namespace:
    risk: R0
    capabilities: [tools.discover]
    side_effect: none
  files.write:
    risk: R2
    capabilities: [filesystem.write.scoped]
    side_effect: local_write
  memory.note:
    risk: R2
    capabilities: [memory.write]
    side_effect: local_write
  memory.recall:
    risk: R1
    capabilities: [memory.read]
    side_effect: none
  memory.forget:
    risk: R2
    capabilities: [memory.forget]
    side_effect: local_write
    # User-directed forgetting: conservative plan-first; ambiguous targets
    # are never deleted. Tombstone is the default mode (non-content audit
    # marker retained); full row deletion only in "delete" mode.
  shell.exec:
    risk: R2
    capabilities: [shell.exec.scoped]
    side_effect: local_write
    # Deterministic command guard runs before policy: destructive patterns are DENY (R5).
  subagent.parallel:
    risk: R2
    capabilities: [subagent.spawn]
    side_effect: local_write
    # 2-3 children at once; same carve/intersection/depth rules as subagent.spawn.
  subagent.spawn:
    risk: R2
    capabilities: [subagent.spawn]
    side_effect: local_write
    # Spawning carves budget from the parent (never additive) and intersects
    # capabilities; needs a bound approval like other local writes.
  subagent.list:
    risk: R0
    capabilities: [subagent.read]
    side_effect: none
  subagent.status:
    risk: R0
    capabilities: [subagent.read]
    side_effect: none
  subagent.send:
    risk: R2
    capabilities: [subagent.write]
    side_effect: local_write
  subagent.close:
    risk: R1
    capabilities: [subagent.write]
    side_effect: none
  browser.start_session:
    risk: R2
    capabilities: [browser.session]
    side_effect: local_write
    # Opens a managed session on the persistent profile (Phase 4).
  browser.observe:
    risk: R0
    capabilities: [browser.observe]
    side_effect: none
    # Structured read of the current page. Page content is untrusted data.
  browser.act:
    risk: R2
    capabilities: [browser.act]
    side_effect: local_write
    # One grounded action from the closed BrowserAction union. Deployments
    # must use browser.namespace.risk_for_action: kind=confirm_commit
    # escalates to R4 (commit barrier — needs a fresh state-bound approval)
    # and kind=upload escalates to R3. Evasion kinds are refused by the
    # operator before policy is even consulted.
  browser.checkpoint:
    risk: R1
    capabilities: [browser.checkpoint]
    side_effect: none
  browser.close_session:
    risk: R1
    capabilities: [browser.session]
    side_effect: none
  scheduler.create:
    risk: R2
    capabilities: [scheduler.manage]
    side_effect: local_write
    # Creating a recurring schedule records the user's approval_scope naming
    # the schedule; one-shot schedules authorize exactly one run.
  scheduler.list:
    risk: R0
    capabilities: [scheduler.read]
    side_effect: none
  scheduler.get:
    risk: R0
    capabilities: [scheduler.read]
    side_effect: none
  scheduler.update:
    risk: R2
    capabilities: [scheduler.manage]
    side_effect: local_write
    # Edits bump the schedule version; fired instances keep snapshots.
  scheduler.remove:
    risk: R2
    capabilities: [scheduler.manage]
    side_effect: local_write
  scheduler.run_now:
    risk: R2
    capabilities: [scheduler.manage]
    side_effect: local_write
  scheduler.enable:
    risk: R2
    capabilities: [scheduler.manage]
    side_effect: local_write
  scheduler.disable:
    risk: R2
    capabilities: [scheduler.manage]
    side_effect: local_write
    # Disabling prevents future enqueues immediately.
  scheduler.hook_create:
    risk: R2
    capabilities: [scheduler.manage]
    side_effect: local_write
  scheduler.hook_list:
    risk: R0
    capabilities: [scheduler.read]
    side_effect: none
  connector.connect:
    risk: R2
    capabilities: [connector.manage]
    side_effect: local_write
    # Starts an OAuth PKCE ceremony or consumes a Secure Vault API-key
    # capture. Raw secrets never pass through tool arguments.
  connector.complete_oauth:
    risk: R2
    capabilities: [connector.manage]
    side_effect: local_write
    # Server-side code exchange; the token goes straight to the vault.
  connector.status:
    risk: R0
    capabilities: [connector.read]
    side_effect: none
    # Health + declared capabilities only; never credential material.
  connector.disconnect:
    risk: R2
    capabilities: [connector.manage]
    side_effect: local_write
    # Revokes provider tokens where supported and deletes vault material.
  connector.github.get_repo:
    risk: R0
    capabilities: [connector.github.read]
    side_effect: none
    # Read-only metadata; requires the repo.read scope on the connection.
  connector.github.star:
    risk: R3
    capabilities: [connector.github.write]
    side_effect: external_write
    # Low-risk external write on the user's account: needs a valid bound
    # approval and the repo.write scope. Grant is single-use.
  connector.github.unstar:
    risk: R3
    capabilities: [connector.github.write]
    side_effect: external_write
    # Same approval treatment as star.
  production.quota_status:
    risk: R1
    capabilities: [production.read]
    side_effect: none
  production.backup_now:
    risk: R2
    capabilities: [production.operate]
    side_effect: local_write
  production.request_export:
    risk: R2
    capabilities: [production.operate]
    side_effect: local_write
  production.restore:
    risk: R3
    capabilities: [production.operate]
    side_effect: local_write
    # Restore overwrites live tenant state from a snapshot.
  production.delete_tenant:
    risk: R4
    capabilities: [production.destroy]
    side_effect: destructive
    # Irreversible; requires a bound approval and confirm == tenant_id.
  production.channel_send:
    risk: R2
    capabilities: [messaging.send]
    side_effect: external_write

  # --- App connectors via Composio (issue #7). Reads R1; reversible drafts/labels R2;
  # --- anything sent/created/changed/deleted on the user's behalf is R3 and always asks.
  gmail.fetch_emails:
    risk: R1
    capabilities: [connector.gmail]
    side_effect: none
  gmail.fetch_message_by_thread_id:
    risk: R1
    capabilities: [connector.gmail]
    side_effect: none
  gmail.fetch_message_by_message_id:
    risk: R1
    capabilities: [connector.gmail]
    side_effect: none
  gmail.list_labels:
    risk: R1
    capabilities: [connector.gmail]
    side_effect: none
  gmail.get_profile:
    risk: R1
    capabilities: [connector.gmail]
    side_effect: none
  gmail.create_email_draft:
    risk: R2
    capabilities: [connector.gmail]
    side_effect: external_write
  gmail.add_label_to_email:
    risk: R2
    capabilities: [connector.gmail]
    side_effect: external_write
  gmail.send_email:
    risk: R3
    capabilities: [connector.gmail]
    side_effect: external_write
  gmail.reply_to_thread:
    risk: R3
    capabilities: [connector.gmail]
    side_effect: external_write
  gmail.send_draft:
    risk: R3
    capabilities: [connector.gmail]
    side_effect: external_write
  gmail.forward_message:
    risk: R3
    capabilities: [connector.gmail]
    side_effect: external_write
  calendar.events_list:
    risk: R1
    capabilities: [connector.calendar]
    side_effect: none
  calendar.find_event:
    risk: R1
    capabilities: [connector.calendar]
    side_effect: none
  calendar.find_free_slots:
    risk: R1
    capabilities: [connector.calendar]
    side_effect: none
  calendar.list_calendars:
    risk: R1
    capabilities: [connector.calendar]
    side_effect: none
  calendar.create_event:
    risk: R3
    capabilities: [connector.calendar]
    side_effect: external_write
  calendar.quick_add:
    risk: R3
    capabilities: [connector.calendar]
    side_effect: external_write
  calendar.update_event:
    risk: R3
    capabilities: [connector.calendar]
    side_effect: external_write
  calendar.delete_event:
    risk: R3
    capabilities: [connector.calendar]
    side_effect: external_write
