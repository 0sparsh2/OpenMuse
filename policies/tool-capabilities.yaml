# Tool -> risk mapping — policies/tool-capabilities.yaml
# A deployment maps each tool capability and argument pattern to a baseline class.
# Phase 1 ships R0-R2 tools only. Later phases add R3-R5 tools here.
tools:
  system.clock:
    risk: R0
    capabilities: [time.read]
    side_effect: none
  math.calc:
    risk: R0
    capabilities: [math.eval]
    side_effect: none
  files.read:
    risk: R0
    capabilities: [filesystem.read.scoped]
    side_effect: none
  files.list:
    risk: R0
    capabilities: [filesystem.read.scoped]
    side_effect: none
  web.fetch:
    risk: R0
    capabilities: [network.fetch.public]
    side_effect: none
  tools.load_namespace:
    risk: R0
    capabilities: [tools.discover]
    side_effect: none
  files.write:
    risk: R2
    capabilities: [filesystem.write.scoped]
    side_effect: local_write
  memory.note:
    risk: R2
    capabilities: [memory.write]
    side_effect: local_write
  memory.recall:
    risk: R1
    capabilities: [memory.read]
    side_effect: none
  memory.forget:
    risk: R2
    capabilities: [memory.forget]
    side_effect: local_write
    # User-directed forgetting: conservative plan-first; ambiguous targets
    # are never deleted. Tombstone is the default mode (non-content audit
    # marker retained); full row deletion only in "delete" mode.
  shell.exec:
    risk: R2
    capabilities: [shell.exec.scoped]
    side_effect: local_write
    # Deterministic command guard runs before policy: destructive patterns are DENY (R5).
  subagent.spawn:
    risk: R2
    capabilities: [subagent.spawn]
    side_effect: local_write
    # Spawning carves budget from the parent (never additive) and intersects
    # capabilities; needs a bound approval like other local writes.
  subagent.list:
    risk: R0
    capabilities: [subagent.read]
    side_effect: none
  subagent.status:
    risk: R0
    capabilities: [subagent.read]
    side_effect: none
  subagent.send:
    risk: R2
    capabilities: [subagent.write]
    side_effect: local_write
  subagent.close:
    risk: R1
    capabilities: [subagent.write]
    side_effect: none
  browser.start_session:
    risk: R2
    capabilities: [browser.session]
    side_effect: local_write
    # Opens a managed session on the persistent profile (Phase 4).
  browser.observe:
    risk: R0
    capabilities: [browser.observe]
    side_effect: none
    # Structured read of the current page. Page content is untrusted data.
  browser.act:
    risk: R2
    capabilities: [browser.act]
    side_effect: local_write
    # One grounded action from the closed BrowserAction union. Deployments
    # must use browser.namespace.risk_for_action: kind=confirm_commit
    # escalates to R4 (commit barrier — needs a fresh state-bound approval)
    # and kind=upload escalates to R3. Evasion kinds are refused by the
    # operator before policy is even consulted.
  browser.checkpoint:
    risk: R1
    capabilities: [browser.checkpoint]
    side_effect: none
  browser.close_session:
    risk: R1
    capabilities: [browser.session]
    side_effect: none
